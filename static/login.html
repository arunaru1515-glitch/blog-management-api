<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blog Management - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #dbeafe
                );
        }


        .login-container {

            width: 430px;

            padding: 40px;

            background: #ffffff;

            border-radius: 22px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.12);

            text-align: center;
        }


        .logo {

            width: 70px;

            height: 70px;

            margin: 0 auto 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 18px;

            background: #635bff;

            color: white;

            font-size: 30px;

            font-weight: bold;
        }


        h1 {

            color: #172554;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .subtitle {

            color: #64748b;

            font-size: 15px;

            margin-bottom: 28px;

            line-height: 1.5;
        }


        .input-group {

            text-align: left;

            margin-bottom: 16px;
        }


        .input-group label {

            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;
        }


        .input-group input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }


        .input-group input:focus {

            border-color: #635bff;

            box-shadow:
                0 0 0 3px
                rgba(99, 91, 255, 0.12);
        }


        .login-btn {

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background: #635bff;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }


        .login-btn:hover {

            background: #5048d8;
        }


        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 24px 0;

            color: #94a3b8;

            font-size: 13px;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #e2e8f0;
        }


        .social-btn {

            width: 100%;

            padding: 13px;

            margin-bottom: 12px;

            border-radius: 10px;

            background: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;
        }


        .google {

            border: 1px solid #cbd5e1;

            color: #334155;
        }


        .facebook {

            border: 1px solid #cbd5e1;

            color: #1877f2;
        }


        .social-btn:hover {

            background: #f8fafc;
        }


        .social-icon {

            font-weight: bold;

            font-size: 18px;
        }


        .message {

            margin-top: 12px;

            font-size: 14px;

            min-height: 20px;
        }


        .signup-text {

            margin-top: 22px;

            color: #64748b;

            font-size: 14px;
        }


        .signup-text a {

            color: #635bff;

            font-weight: 600;

            text-decoration: none;

            cursor: pointer;
        }


        .signup-text a:hover {

            text-decoration: underline;
        }


        .footer {

            margin-top: 20px;

            color: #94a3b8;

            font-size: 12px;
        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- =====================================================
         LOGIN SECTION
    ====================================================== -->

    <div id="loginSection">


        <div class="logo">
            B
        </div>


        <h1>
            Welcome Back
        </h1>


        <p class="subtitle">
            Login to your Blog Management account
        </p>


        <form id="loginForm">


            <!-- EMAIL -->

            <div class="input-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Login
            </button>


        </form>


        <!-- DIVIDER -->

        <div class="divider">
            OR
        </div>


        <!-- GOOGLE -->

        <button
            type="button"
            class="social-btn google"
            onclick="loginWithGoogle()"
        >

            <span class="social-icon">
                G
            </span>

            Continue with Google

        </button>


        <!-- FACEBOOK -->

        <button
            type="button"
            class="social-btn facebook"
            onclick="loginWithFacebook()"
        >

            <span class="social-icon">
                f
            </span>

            Continue with Facebook

        </button>


        <!-- LOGIN MESSAGE -->

        <p
            id="loginMessage"
            class="message"
        ></p>


        <!-- SIGNUP -->

        <p class="signup-text">

            Don't have an account?

            <a onclick="showSignup()">
                Sign Up
            </a>

        </p>


        <div class="footer">

            Secure authentication powered by Auth0

        </div>


    </div>



    <!-- =====================================================
         SIGNUP SECTION
    ====================================================== -->

    <div
        id="signupSection"
        style="display: none;"
    >


        <div class="logo">
            B
        </div>


        <h1>
            Create Account
        </h1>


        <p class="subtitle">
            Create your Blog Management account
        </p>


        <form id="signupForm">


            <!-- USERNAME -->

            <div class="input-group">

                <label for="signupUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="signupUsername"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- SIGNUP BUTTON -->

            <button
                type="submit"
                class="login-btn"
                id="signupButton"
            >
                Create Account
            </button>


        </form>


        <!-- SIGNUP MESSAGE -->

        <p
            id="signupMessage"
            class="message"
        ></p>


        <!-- LOGIN LINK -->

        <p class="signup-text">

            Already have an account?

            <a onclick="showLogin()">
                Login
            </a>

        </p>


    </div>


</div>



<script>


/* =========================================================
   NORMAL LOGIN
========================================================= */


document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            /* ---------------------------------------------
               GET FORM VALUES
            --------------------------------------------- */

            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("loginPassword")
                    .value;


            const message =
                document
                    .getElementById("loginMessage");


            const loginButton =
                document
                    .getElementById("loginButton");


            /* ---------------------------------------------
               CLEAR OLD MESSAGE
            --------------------------------------------- */

            message.textContent = "";


            /* ---------------------------------------------
               CREATE FORM DATA

               FastAPI OAuth2PasswordRequestForm expects:

               username
               password
            --------------------------------------------- */

            const formData =
                new URLSearchParams();


            formData.append(
                "username",
                email
            );


            formData.append(
                "password",
                password
            );


            try {


                /* -----------------------------------------
                   DISABLE BUTTON
                ----------------------------------------- */

                loginButton.disabled = true;

                loginButton.textContent =
                    "Logging in...";


                /* -----------------------------------------
                   LOGIN REQUEST

                   IMPORTANT:
                   Backend endpoint is:

                   POST /auth/login

                   NOT:

                   /auth/password-login
                ----------------------------------------- */

                const response =
                    await fetch(
                        "/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body: formData
                        }
                    );


                /* -----------------------------------------
                   READ RESPONSE
                ----------------------------------------- */

                const data =
                    await response.json();


                /* -----------------------------------------
                   CHECK ERROR
                ----------------------------------------- */

                if (!response.ok) {

                    message.style.color =
                        "red";

                    message.textContent =
                        data.detail ||
                        "Invalid email or password";

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";

                    return;
                }


                /* -----------------------------------------
                   SAVE JWT TOKEN
                ----------------------------------------- */

                localStorage.setItem(
                    "access_token",
                    data.access_token
                );


                /* -----------------------------------------
                   SUCCESS MESSAGE
                ----------------------------------------- */

                message.style.color =
                    "green";

                message.textContent =
                    "Login successful!";


                /* -----------------------------------------
                   REDIRECT
                ----------------------------------------- */

                setTimeout(
                    function() {

                        window.location.href =
                            "/dashboard";

                    },
                    500
                );


            }

            catch(error) {


                console.error(
                    "Login error:",
                    error
                );


                message.style.color =
                    "red";

                message.textContent =
                    "Unable to connect to server.";


                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

            }

        }
    );



/* =========================================================
   SIGN UP
========================================================= */


document
    .getElementById("signupForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            /* ---------------------------------------------
               GET FORM VALUES
            --------------------------------------------- */

            const username =
                document
                    .getElementById("signupUsername")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("signupEmail")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("signupPassword")
                    .value;


            const message =
                document
                    .getElementById("signupMessage");


            const signupButton =
                document
                    .getElementById("signupButton");


            message.textContent = "";


            try {


                /* -----------------------------------------
                   DISABLE BUTTON
                ----------------------------------------- */

                signupButton.disabled = true;

                signupButton.textContent =
                    "Creating Account...";


                /* -----------------------------------------
                   REGISTER USER
                ----------------------------------------- */

                const response =
                    await fetch(
                        "/auth/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                username:
                                    username,

                                email:
                                    email,

                                password:
                                    password

                            })
                        }
                    );


                /* -----------------------------------------
                   READ RESPONSE
                ----------------------------------------- */

                const data =
                    await response.json();


                /* -----------------------------------------
                   CHECK ERROR
                ----------------------------------------- */

                if (!response.ok) {

                    message.style.color =
                        "red";

                    message.textContent =
                        data.detail ||
                        "Registration failed";

                    signupButton.disabled =
                        false;

                    signupButton.textContent =
                        "Create Account";

                    return;
                }


                /* -----------------------------------------
                   SUCCESS
                ----------------------------------------- */

                message.style.color =
                    "green";

                message.textContent =
                    "Account created successfully!";


                /* -----------------------------------------
                   GO TO LOGIN
                ----------------------------------------- */

                setTimeout(
                    function() {

                        showLogin();

                        document
                            .getElementById(
                                "loginEmail"
                            )
                            .value = email;

                    },
                    1000
                );


            }

            catch(error) {


                console.error(
                    "Signup error:",
                    error
                );


                message.style.color =
                    "red";

                message.textContent =
                    "Unable to connect to server.";


                signupButton.disabled =
                    false;

                signupButton.textContent =
                    "Create Account";

            }

        }
    );



/* =========================================================
   GOOGLE LOGIN
========================================================= */


function loginWithGoogle() {

    window.location.href =
        "/auth/google";

}



/* =========================================================
   FACEBOOK LOGIN
========================================================= */


function loginWithFacebook() {

    window.location.href =
        "/auth/facebook";

}



/* =========================================================
   SHOW SIGNUP
========================================================= */


function showSignup() {

    document
        .getElementById("loginSection")
        .style.display =
            "none";


    document
        .getElementById("signupSection")
        .style.display =
            "block";


    /* Clear messages */

    document
        .getElementById("loginMessage")
        .textContent = "";

}



/* =========================================================
   SHOW LOGIN
========================================================= */


function showLogin() {

    document
        .getElementById("signupSection")
        .style.display =
            "none";


    document
        .getElementById("loginSection")
        .style.display =
            "block";


    /* Clear messages */

    document
        .getElementById("signupMessage")
        .textContent = "";

}


</script>


</body>

</html>
